slam_toolbox:
  ros__parameters:
    # --- GENERAL ---
    use_sim_time: false
    mode: mapping
    scan_topic: /scan
    odom_topic: /odom_rf2o
    odom_frame: odom
    base_frame: base_link
    map_frame: map
    scan_queue_size: 20                        # Conservateur
    
    # --- SOLVER ---
    solver_plugin: solver_plugins::CeresSolver
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: HuberLoss
    
    # --- MAP UPDATE ---
    map_update_interval: 0.3       # Faster for real-time corrections
    resolution: 0.05
    
    # --- SCAN MATCHING DISABLED - follow RF2O only ---
    use_scan_matching: true           # ❌ OFF - lets RF2O do all the work
    use_response_expansion: true
    minimum_travel_distance: 0.05
    minimum_travel_heading: 0.05
    minimum_time_interval: 0.05
    
    # ⭐ LOOP CLOSURE - DISABLED (causes catastrophic divergence) ---
    do_loop_closing: true
    
    # --- SEARCH SPACE (conservative) ---
    correlation_search_space_dimension: 0.5    # CONSERVATIVE - not too far from the odom
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
    loop_search_space_dimension: 8.0           # Moderate
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.1
    
    # --- ANGLE SEARCH (tuned for turns) ---
    coarse_search_angle_offset: 0.8            # Wider to detect rotation errors
    coarse_angle_resolution: 0.0262            # 1.5° - finer
    fine_search_angle_offset: 0.3              # Doubles the fine search space
    fine_angle_resolution: 0.00436             # 0.25° - very fine for turns
    
    # --- VARIANCE PENALTIES (ULTRA STRICT - stick to RF2O) ---
    angle_variance_penalty: 1.0               # ULTRA STRICT - almost never deviate
    distance_variance_penalty: 1.0            # ULTRA STRICT - stay glued to RF2O
    
    # --- OPTIMIZATION (strengthened) ---
    max_iterations: 20             # RAISED for better graph convergence
    num_threads: 4
    
    # --- LINK MATCHING ---
    link_match_minimum_response_fine: 0.6
    link_scan_maximum_distance: 2.0
    
    # --- STABILIZATION (raised to avoid message dropping) ---
    tf_buffer_duration: 60.0
    transform_timeout: 2.0
    
    # --- OCCUPANCY GRID ---
    occupied_threshold: 65
    free_threshold: 25
    
    # --- DEBUG ---
    debug_logging: true
    log_raw_scans: true
    log_matching_matrices: true
