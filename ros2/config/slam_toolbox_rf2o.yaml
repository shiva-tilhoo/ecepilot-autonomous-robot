slam_toolbox:
  ros__parameters:
    solver_plugin: solver_plugins::CeresSolver
    max_iterations: 40
    huber_scale: 0.1 # More tolerance to computation errors

    # --- TF SAFETY ---
    transform_timeout: 0.5 # Give the system more time to synchronise
    tf_buffer_duration: 10.0

    # --- MODE SCAN MATCHING DOMINANT ---
    use_scan_matching: true
    # VERY LOW penalties (0.01) so that SLAM almost ignores 
    # the odometry and realigns on the shapes
    angle_variance_penalty: 0.01    
    distance_variance_penalty: 0.01 

    # Search MUCH wider so the wall is never lost
    coarse_search_angle_offset: 1.5
    coarse_angle_resolution: 0.005
    correlation_search_space_dimension: 4.0 

    # --- RATE ---
    minimum_time_interval: 0.1
    minimum_travel_distance: 0.05
    minimum_travel_heading: 0.05